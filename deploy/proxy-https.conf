server {
    listen 80;
    listen [::]:80;
    server_name intro.archois.cn;
    location ^~ /.well-known/acme-challenge/ { root /data/mypage-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name intro.archois.cn;
    ssl_certificate /etc/letsencrypt/mypage/live/intro.archois.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/mypage/live/intro.archois.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $homepage_backend personal-homepage:80;
        proxy_pass http://$homepage_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
