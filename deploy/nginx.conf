server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
